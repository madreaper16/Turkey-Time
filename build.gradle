buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies { classpath "net.fabricmc:fabric-loom:${loom_version}" }
}
apply plugin: 'net.fabricmc.fabric-loom'

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()
    mods {
        turkeytime {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        server {
            runDir 'run/server'
            programArg 'nogui'
        }
        client { runDir 'run/client' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'turkeytime_tests'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') { from('COPYRIGHT.txt', 'LICENSE') }
tasks.named('sourcesJar') { from('COPYRIGHT.txt', 'LICENSE') }

// Smoke-test the actual distributable, without project class/resource directories.
['Server', 'Client'].each { side ->
    tasks.register("runPackaged${side}", JavaExec) {
        dependsOn tasks.jar
        def client = side == 'Client'
        def runtime = client ? sourceSets.client.runtimeClasspath : sourceSets.main.runtimeClasspath
        classpath = runtime.filter { it.name.endsWith('.jar') }
        mainClass = "net.fabricmc.loader.impl.launch.knot.Knot${side}"
        workingDir = file("run/release/${side.toLowerCase()}")
        standardInput = System.in
        maxHeapSize = '2G'
        // Match the working Loom launcher: native font/render calls need its stack margin.
        jvmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
        if (client) jvmArgs '-XX:StackShadowPages=32'
        systemProperty 'fabric.development', 'false'
        doFirst {
            workingDir.mkdirs()
            def mods = new File(workingDir, 'mods')
            mods.mkdirs()
            project.copy {
                from tasks.jar.archiveFile
                into mods
                rename { 'turkey-time-qa.jar' }
            }
            def api = runtime.files.find { it.name == "fabric-api-${fabric_api_version}.jar" }
            if (api == null) throw new GradleException('Missing cached Fabric API JAR')
            project.copy {
                from api
                into mods
                rename { 'fabric-api-qa.jar' }
            }
            def common = classpath.files.find { it.name.startsWith('minecraft-common-') }
            if (common == null) throw new GradleException('Missing cached Minecraft common JAR')
            systemProperty 'fabric.gameJarPath', common.absolutePath
            if (client) {
                def clientJar = classpath.files.find { it.name.startsWith('minecraft-clientOnly-') }
                systemProperty 'fabric.gameJarPath.client', clientJar.absolutePath
                args '--username', 'TurkeyReleaseQA', '--accessToken', '0', '--version', minecraft_version,
                        '--assetIndex', '26.3-34', '--assetsDir', new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/assets').absolutePath
            } else args 'nogui'
        }
    }
}
